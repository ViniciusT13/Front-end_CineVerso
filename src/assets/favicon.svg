<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- Gradientes para o efeito 3D e brilhante -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffa726"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ícone da Claquete -->
  <g transform="translate(15, 12)" filter="url(#shadow)">
    <!-- Parte superior inclinada -->
    <path d="M4 14 L56 2 L60 12 L8 24 Z" fill="url(#orangeGrad)" stroke="#bf360c" stroke-width="1.5" rx="1"/>
    <!-- Listras brancas -->
    <path d="M16 9 L22 7 L20 12 L14 14 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M32 5 L38 3 L36 8 L30 10 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M48 1 L54 -1 L52 4 L46 6 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Corpo principal da claquete -->
    <rect x="4" y="24" width="60" height="42" rx="6" fill="url(#orangeGrad)" stroke="#bf360c" stroke-width="1.5"/>
    
    <!-- Área interna branca -->
    <rect x="8" y="28" width="52" height="34" rx="4" fill="#ffffff"/>
    
    <!-- Ícone de Play -->
    <polygon points="26,38 26,52 42,45" fill="url(#orangeGrad)"/>
    
    <!-- Parafusos / Detalhes -->
    <circle cx="10" cy="29" r="2.5" fill="#bf360c"/>
    <circle cx="60" cy="29" r="2.5" fill="#bf360c"/>
  </g>

  <!-- Texto "CineVerso" -->
  <text x="92" y="53" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="url(#textGrad)" filter="url(#shadow)">CineVerso</text>
</svg>
