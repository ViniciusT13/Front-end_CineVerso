<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="100%" height="100%">
  <!-- Ícone da Claquete -->
  <g transform="translate(10, 10)">
    <!-- Parte superior inclinada -->
    <path d="M2 12L48 2L52 12L6 22Z" fill="#f59e0b" />
    <!-- Listras da parte superior -->
    <rect x="12" y="7" width="8" height="6" transform="rotate(-12 12 7)" fill="#0f1117" />
    <rect x="28" y="3" width="8" height="6" transform="rotate(-12 28 3)" fill="#0f1117" />
    
    <!-- Corpo principal -->
    <rect x="2" y="22" width="52" height="36" rx="6" fill="#f59e0b" />
    <!-- Ícone de Play interno -->
    <polygon points="21,32 21,48 37,40" fill="#0f1117" />
    <!-- Detalhes de parafuso -->
    <circle cx="8" cy="27" r="2" fill="#0f1117" />
    <circle cx="48" cy="27" r="2" fill="#0f1117" />
  </g>
  
  <!-- Texto "CineVerso" -->
  <text x="75" y="47" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#f59e0b">CineVerso</text>
</svg>
